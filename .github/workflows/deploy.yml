name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pyinstaller

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          Move-Item -Path dist -Destination ..\backend\dist -Force

      - name: Package with PyInstaller
        run: |
          cd backend
          pyinstaller --onefile --noconsole --add-data "dist;dist" --name SocketUI server.py

      - name: Create Zip Package
        run: |
          New-Item -ItemType Directory -Path SocketUI -Force
          Copy-Item -Path backend\dist\SocketUI.exe -Destination SocketUI\
          Compress-Archive -Path SocketUI\* -DestinationPath SocketUI.zip -Force

      - name: Create or update rolling release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SocketUI - Latest Build"
          files: |
            SocketUI.zip
