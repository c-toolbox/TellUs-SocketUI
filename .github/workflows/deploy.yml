name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          if (Test-Path ..\backend\dist) { Remove-Item -Recurse -Force ..\backend\dist }
          Copy-Item -Path dist -Destination ..\backend\dist -Recurse -Force

      - name: Build Executable with PyInstaller
        run: |
          cd backend
          python -m PyInstaller server.py `
            --onefile `
            --noconsole `
            --name SocketUI `
            --add-data "dist;dist" `
            --icon dist\icon.ico `
            --distpath ..\SocketUI `
            --workpath build

      - name: Create Zip Package
        run: |
          Compress-Archive -Path SocketUI\* -DestinationPath SocketUI.zip -Force

      - name: Compile Inno Setup Installer
        uses: ammaraskar/inno-setup-action@v2
        with:
          filepath: installer.iss

      - name: Create or update rolling release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SocketUI - Latest Build"
          files: |
            SocketUI-Installer.exe
            SocketUI.zip
